<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Halloween: mesma logo v3, barras em laranja abóbora, a maior vira jack-o'-lantern e o anel fica roxo -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A3200"/>
      <stop offset="0.5" stop-color="#F26A00"/>
      <stop offset="1" stop-color="#FFA640"/>
    </linearGradient>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E0042"/>
      <stop offset="0.5" stop-color="#4A0068"/>
      <stop offset="1" stop-color="#2E0042"/>
    </linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A00C4"/>
      <stop offset="0.5" stop-color="#C23BFF"/>
      <stop offset="1" stop-color="#8A00C4"/>
    </linearGradient>
    <clipPath id="top"><rect x="-400" y="-400" width="1824" height="980"/></clipPath>
    <clipPath id="bottom"><rect x="-400" y="580" width="1824" height="900"/></clipPath>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1024" height="1024" fill="#000"/>

  <!-- morcegos -->
  <g fill="#7A1FB8">
    <path transform="translate(236 262) rotate(-8) scale(0.95)" d="M0 0 C10 -12 26 -16 40 -10 C36 -4 36 2 40 6 C46 0 52 0 55 4 L58 -8 L62 2 L66 -8 L69 4 C72 0 78 0 84 6 C88 2 88 -4 84 -10 C98 -16 114 -12 124 0 C112 -2 104 4 102 14 C96 6 88 6 82 12 C78 8 70 8 62 18 C54 8 46 8 42 12 C36 6 28 6 22 14 C20 4 12 -2 0 0 Z"/>
    <path transform="translate(420 182) rotate(10) scale(0.6)" d="M0 0 C10 -12 26 -16 40 -10 C36 -4 36 2 40 6 C46 0 52 0 55 4 L58 -8 L62 2 L66 -8 L69 4 C72 0 78 0 84 6 C88 2 88 -4 84 -10 C98 -16 114 -12 124 0 C112 -2 104 4 102 14 C96 6 88 6 82 12 C78 8 70 8 62 18 C54 8 46 8 42 12 C36 6 28 6 22 14 C20 4 12 -2 0 0 Z"/>
  </g>

  <!-- anel: metade de trás -->
  <g transform="rotate(-23 512 580)" filter="url(#g)"><g clip-path="url(#top)">
    <ellipse cx="512" cy="580" rx="440" ry="44" fill="none" stroke="url(#ringBack)" stroke-width="30"/>
    <ellipse cx="512" cy="580" rx="440" ry="44" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="5"/>
  </g></g>

  <!-- cabinho da abóbora em cima da barra grande -->
  <path d="M694 300 C692 282 696 266 710 254 L720 262 C710 272 708 286 712 300 Z" fill="#3E6B1F"/>

  <!-- barras -->
  <rect x="247" y="513" width="150" height="247" rx="16" fill="url(#bar)"/>
  <rect x="437" y="409" width="150" height="351" rx="16" fill="url(#bar)"/>
  <rect x="627" y="298" width="150" height="462" rx="16" fill="url(#bar)"/>

  <!-- rosto de jack-o'-lantern entalhado na barra grande -->
  <g fill="#000">
    <path d="M652 372 L688 372 L670 338 Z"/>
    <path d="M716 372 L752 372 L734 338 Z"/>
    <path d="M694 396 L710 396 L702 382 Z"/>
    <path d="M650 410 L754 410 Q748 446 702 448 Q656 446 650 410 Z M668 410 L676 422 L684 410 Z M694 410 L702 422 L710 410 Z M720 410 L728 422 L736 410 Z"
          fill-rule="evenodd"/>
  </g>

  <!-- anel: metade da frente -->
  <g transform="rotate(-23 512 580)" filter="url(#g)"><g clip-path="url(#bottom)">
    <ellipse cx="512" cy="580" rx="440" ry="44" fill="none" stroke="url(#ringFront)" stroke-width="30"/>
    <ellipse cx="512" cy="580" rx="440" ry="44" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="5"/>
  </g></g>
</svg>
