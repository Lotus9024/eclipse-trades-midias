<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Anel estilo Saturno: inclinação 23°, achatamento 40, largura 400, espessura 26, divisão 4, brilho 55%, halo 10, altura 510 -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B21B6"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <linearGradient id="ringBack" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B0F80"/><stop offset="0.5" stop-color="#5B21B6"/><stop offset="1" stop-color="#3B0F80"/></linearGradient>
    <linearGradient id="ringFront" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6D28D9"/><stop offset="0.5" stop-color="#b898ee"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
    <clipPath id="top"><rect x="0" y="0" width="1024" height="510"/></clipPath>
    <clipPath id="bottom"><rect x="0" y="510" width="1024" height="514"/></clipPath>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1024" height="1024" fill="#000"/>
  <g transform="rotate(-23 512 510)" filter="url(#g)"><g clip-path="url(#top)"><ellipse cx="512" cy="510" rx="400" ry="40" fill="none" stroke="url(#ringBack)" stroke-width="26"/><ellipse cx="512" cy="510" rx="400" ry="40" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="4"/></g></g>
  <rect x="300" y="500" width="118" height="190" rx="12" fill="url(#bar)"/>
  <rect x="453" y="420" width="118" height="270" rx="12" fill="url(#bar)"/>
  <rect x="606" y="335" width="118" height="355" rx="12" fill="url(#bar)"/>
  <g transform="rotate(-23 512 510)" filter="url(#g)"><g clip-path="url(#bottom)"><ellipse cx="512" cy="510" rx="400" ry="40" fill="none" stroke="url(#ringFront)" stroke-width="26"/><ellipse cx="512" cy="510" rx="400" ry="40" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="4"/></g></g>
</svg>
